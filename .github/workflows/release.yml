name: Release

# 打 tag (v*) 时触发:以 stable 稳定通道构建单文件产物并发布 GitHub Release
# 产物 downloadURL 与 updateURL 指向 GitHub Releases 永久最新下载直链

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: 构建稳定通道产物
        run: |
          node build.mjs --channel=stable
          node --check huggingface-chinese-plus.user.js

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: huggingface-chinese-plus.user.js
          generate_release_notes: true
